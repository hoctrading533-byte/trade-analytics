<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>TradeZella</title>
  <script>
    ;(() => {
      try {
        const theme = localStorage.getItem('luminafox_theme') || 'dark'
        const safeTheme = theme === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = safeTheme
        document.documentElement.style.colorScheme = safeTheme
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    })()
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
